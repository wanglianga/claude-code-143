version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: daywork-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: daywork
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./server
    container_name: daywork-server
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: daywork
      JWT_SECRET: daywork-prod-secret
      PORT: 3000
      UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
    ports:
      - "3000:3000"
    volumes:
      - server-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    container_name: daywork-web
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mysql-data:
  server-uploads:
